trigger:
- main

variables:
  RUN_SETUP: "false"

# =========================================
# SETUP WORKSPACES (opcional, manual)
# =========================================
stages:
- stage: Setup
  displayName: "Inicializar Workspaces"
  condition: eq(variables['RUN_SETUP'], 'true')
  jobs:
  - job: InitWorkspaces
    displayName: "Crear Workspaces Terraform"
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self

    - task: AzureCLI@2
      inputs:
        azureSubscription: 'azure-terraform-conn'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "Instalando Terraform..."
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo apt-key add -
          sudo apt-add-repository "deb https://apt.releases.hashicorp.com $(lsb_release -cs) main"
          sudo apt-get update
          sudo apt-get install terraform -y

          terraform -version

          cd terraform

          terraform init

          terraform workspace select dev || terraform workspace new dev
          terraform workspace select staging || terraform workspace new staging
          terraform workspace select prod || terraform workspace new prod

          terraform workspace list

# =========================================
# VALIDATE TERRAFORM
# =========================================
- stage: Validate
  displayName: "Validar Terraform"
  jobs:
  - job: ValidateTerraform
    displayName: "Terraform Validate"
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self

    - task: AzureCLI@2
      inputs:
        azureSubscription: 'azure-terraform-conn'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "Instalando Terraform..."
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo apt-key add -
          sudo apt-add-repository "deb https://apt.releases.hashicorp.com $(lsb_release -cs) main"
          sudo apt-get update
          sudo apt-get install terraform -y

          terraform -version

          cd terraform

          terraform init
          terraform fmt -check
          terraform validate

# =========================================
# DEPLOY DEV (sin aprobación)
# =========================================
- stage: Deploy_DEV
  displayName: "Deploy DEV"
  dependsOn: Validate
  jobs:
  - deployment: DeployDev
    displayName: "Despliegue DEV"
    environment: dev      # Environment DEV sin approvals
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: AzureCLI@2
            inputs:
              azureSubscription: 'azure-terraform-conn'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Instalando Terraform..."
                curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo apt-key add -
                sudo apt-add-repository "deb https://apt.releases.hashicorp.com $(lsb_release -cs) main"
                sudo apt-get update
                sudo apt-get install terraform -y

                terraform -version

                cd terraform

                terraform init

                terraform workspace select dev || terraform workspace new dev

                terraform apply -auto-approve

# =========================================
# DEPLOY STAGING (1 aprobación en Environment)
# =========================================
- stage: Deploy_STAGING
  displayName: "Deploy STAGING"
  dependsOn: Deploy_DEV
  condition: succeeded()   # explícito, por claridad
  jobs:
  - deployment: DeployStaging
    displayName: "Desplegar STAGING"
    environment:
      name: staging        # Environment STAGING con 1 approval configurado
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: AzureCLI@2
            inputs:
              azureSubscription: 'azure-terraform-conn'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Instalando Terraform..."
                curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo apt-key add -
                sudo apt-add-repository "deb https://apt.releases.hashicorp.com $(lsb_release -cs) main"
                sudo apt-get update
                sudo apt-get install terraform -y

                terraform -version

                cd terraform

                terraform init

                terraform workspace select staging || terraform workspace new staging

                terraform apply -auto-approve

# =========================================
# DEPLOY PROD (2 aprobaciones en Environment)
# =========================================
- stage: Deploy_PROD
  displayName: "Deploy PROD"
  dependsOn: Deploy_STAGING
  condition: succeeded()
  jobs:
  - deployment: DeployProd
    displayName: "Desplegar PROD"
    environment:
      name: prod           # Environment PROD con 2 approvals configurados
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: AzureCLI@2
            inputs:
              azureSubscription: 'azure-terraform-conn'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Instalando Terraform..."
                curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo apt-key add -
                sudo apt-add-repository "deb https://apt.releases.hashicorp.com $(lsb_release -cs) main"
                sudo apt-get update
                sudo apt-get install terraform -y

                terraform -version

                cd terraform

                terraform init

                terraform workspace select prod || terraform workspace new prod

                terraform apply -auto-approve