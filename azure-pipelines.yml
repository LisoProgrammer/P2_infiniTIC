trigger:
- main

variables:
  RUN_SETUP: "false"

stages:

# =========================================
# SETUP
# =========================================
- stage: Setup
  displayName: "Inicializar Workspaces"
  condition: eq(variables['RUN_SETUP'], 'true')

  jobs:
  - job: init
    displayName: "Crear Workspaces"

    pool:
      vmImage: ubuntu-latest

    steps:
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: 'latest'

    - script: |
        cd terraform
        bash scripts/init-workspaces.sh
      displayName: "Inicializar Workspaces Terraform"

# =========================================
# VALIDATE
# =========================================
- stage: Validate
  displayName: "Validar Terraform"

  jobs:
  - job: validate
    displayName: "Terraform Validate"

    pool:
      vmImage: ubuntu-latest

    steps:
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: 'latest'

    - script: |
        cd terraform
        terraform init
        terraform fmt -check
        terraform validate
      displayName: "Validación Terraform"

# =========================================
# DEPLOY DEV
# =========================================
- stage: Deploy_DEV
  displayName: "Deploy DEV"

  dependsOn: Validate

  jobs:
  - deployment: DeployDev
    displayName: "Desplegar DEV"

    environment: dev

    pool:
      vmImage: ubuntu-latest

    strategy:
      runOnce:
        deploy:
          steps:

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: 'latest'

          - script: |
              cd terraform

              terraform init

              terraform workspace select dev || terraform workspace new dev

              terraform apply -auto-approve
            displayName: "Terraform Apply DEV"

# =========================================
# DEPLOY STAGING
# =========================================
- stage: Deploy_STAGING
  displayName: "Deploy STAGING"

  dependsOn: Deploy_DEV

  jobs:
  - deployment: DeployStaging
    displayName: "Desplegar STAGING"

    environment: staging

    pool:
      vmImage: ubuntu-latest

    strategy:
      runOnce:
        deploy:
          steps:

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: 'latest'

          - script: |
              cd terraform

              terraform init

              terraform workspace select staging || terraform workspace new staging

              terraform apply -auto-approve
            displayName: "Terraform Apply STAGING"

# =========================================
# DEPLOY PROD
# =========================================
- stage: Deploy_PROD
  displayName: "Deploy PROD"

  dependsOn: Deploy_STAGING

  jobs:
  - deployment: DeployProd
    displayName: "Desplegar PROD"

    environment: prod

    pool:
      vmImage: ubuntu-latest

    strategy:
      runOnce:
        deploy:
          steps:

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: 'latest'

          - script: |
              cd terraform

              terraform init

              terraform workspace select prod || terraform workspace new prod

              terraform apply -auto-approve
            displayName: "Terraform Apply PROD"